[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vietnamese-meeting-stt"
version = "0.1.0"
description = "Far-field Vietnamese/English meeting transcription with PhoWhisper"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "accelerate>=0.31,<2",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic-settings>=2.3,<3",
  "python-multipart>=0.0.9,<1",
  "scipy>=1.13,<2",
  "soundfile>=0.12,<1",
  "torch>=2.1,<3",
  "transformers>=4.41,<5",
  "uvicorn[standard]>=0.30,<1",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
meeting-stt = "meeting_stt.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

